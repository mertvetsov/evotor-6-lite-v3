<!doctype html>
<!-- dev-only: bakes the static fallback posters from the real 3D model. Not part of the build. -->
<html lang="ru"><head><meta charset="utf-8" /><title>poster capture</title>
<style>body{margin:0;background:#fbf9f6}#stage{position:relative;width:900px;height:1200px}#stage canvas{width:100%;height:100%}</style>
</head><body><div id="stage"><canvas></canvas></div>
<script type="module">
import { mountTerminal } from './src/terminal.js';
const POSES = {
  hero:  { rx: 0.06, ry: -0.62, rz: 0.16, screen: 0 },
  why:   { rx: 0.10, ry: -1.00, rz: 0.12, screen: 1 },
  tour1: { rx: 0.05, ry: 0.60,  rz: -0.08, screen: 0 },
  tour2: { rx: 0.18, ry: -0.75, rz: 0.06, screen: 1 },
  tour3: { rx: 0.50, ry: -2.60, rz: 0.10, screen: 0 },
  tour4: { rx: 0.08, ry: -5.95, rz: -0.05, screen: 2 },
  form:  { rx: 0.08, ry: 0.75,  rz: -0.05, screen: 2 },
  formwait: { rx: 0.08, ry: 0.75, rz: -0.05, screen: 1 },
  explode: { rx: 0.24, ry: -0.95, rz: 0.05, screen: 3, ex: 1, s: 0.66, x: 0.18, width: 1200, height: 900 },
};
const api = await mountTerminal(document.getElementById('stage'), {
  reduced: true, interactive: false, look: 'light', assetBase: './',
  drive: () => ({ rx: 0, ry: 0, rz: 0, x: 0, y: 0, s: 1 }),
});
// the amount-entry screen (index 3 here: capture adds no live screens) for the exploded view
const sum = new Image();
await new Promise((r) => { sum.onload = r; sum.onerror = r; sum.src = './img/screen-tex-sum.jpg'; });
const sumCanvas = Object.assign(document.createElement('canvas'), { width: 720, height: 1600 });
sumCanvas.getContext('2d').drawImage(sum, 0, 0, 720, 1600);
api.addScreen(sumCanvas, () => false);
window.capture = async () => {
  const done = [];
  for (const [name, p] of Object.entries(POSES)) {
    const url = api.snapshot({ s: 1.02, width: 900, height: 1200, ...p });
    const r = await fetch('http://127.0.0.1:5199/save?name=' + name, { method: 'POST', body: url });
    done.push(name + ':' + r.status);
  }
  return done.join(' ');
};
window.captureReady = true;
</script></body></html>
